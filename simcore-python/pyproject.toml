[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "simcore-python"
version = "0.1.0"
description = "Python bindings for the simcore discrete-event simulation kernel"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"

[tool.maturin]
# Rust [lib] name is `simcore`, so the built extension imports as `simcore`.
module-name = "simcore"
