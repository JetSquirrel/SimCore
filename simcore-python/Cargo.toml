[package]
name = "simcore-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PyO3 bindings driving Python coroutines from the simcore DES kernel (no asyncio)"
publish = false

# The Python extension module is imported as `simcore`.
[lib]
name = "simcore"
crate-type = ["cdylib"]

[dependencies]
simcore-des = { path = ".." }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py312"] }
