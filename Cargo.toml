[package]
# crates.io package is `simcore-des` (the name `simcore` is taken); the library
# target below stays `simcore`, so users depend on simcore-des but `use simcore::…`.
name = "simcore-des"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A tiny deterministic discrete-event simulation kernel for building system simulators"
repository = "https://github.com/JetSquirrel/SimCore"
homepage = "https://github.com/JetSquirrel/SimCore"
readme = "README.md"
keywords = ["simulation", "discrete-event", "des", "simpy", "kernel"]
categories = ["simulation", "science", "concurrency"]
authors = ["Christoph Kuhmuench <christoph.kuhmuench@gmail.com>"]
rust-version = "1.82"
# Keep the published tarball lean — dev-only harnesses and docs stay in git only.
exclude = [
    "compare/",
    "simcore-python/",
    "sim-llm/",
    ".github/",
    "target/",
    ".claude/",
    "TESTING.md",
    "CLAUDE.md",
    "PUBLISHING.md",
]

[package.metadata.docs.rs]
# Document the monte-carlo feature path too.
all-features = true

[lib]
name = "simcore"
path = "src/lib.rs"

[features]
monte-carlo = ["dep:rayon"]

[dependencies]
rand = "0.9"
rand_distr = "0.5"
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simulation"
harness = false

# Queueing-theory validation suite (examples/queueing/): each model is
# checked against its closed-form analytical result. Two-level paths need
# explicit targets; examples/queueing/common/ is a shared module, not a target.
[[example]]
name = "queueing-mm1"
path = "examples/queueing/mm1.rs"

[[example]]
name = "queueing-mmk"
path = "examples/queueing/mmk.rs"

[[example]]
name = "queueing-mmkk"
path = "examples/queueing/mmkk.rs"

[[example]]
name = "queueing-jackson"
path = "examples/queueing/jackson.rs"

[[example]]
name = "queueing-classed-network"
path = "examples/queueing/classed_network.rs"

[[example]]
name = "queueing-closed-network"
path = "examples/queueing/closed_network.rs"

[[example]]
name = "queueing-mg1"
path = "examples/queueing/mg1.rs"

[[example]]
name = "queueing-pareto"
path = "examples/queueing/pareto.rs"

[[example]]
name = "queueing-lcfs"
path = "examples/queueing/lcfs.rs"

[[example]]
name = "queueing-random"
path = "examples/queueing/random.rs"

[[example]]
name = "queueing-priority"
path = "examples/queueing/priority.rs"
