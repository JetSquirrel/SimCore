[package]
name = "simu"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "simu"
path = "src/lib.rs"

[features]
monte-carlo = ["dep:rayon"]

[dependencies]
rand = "0.9"
rand_distr = "0.5"
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simulation"
harness = false
