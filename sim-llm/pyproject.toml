[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-llm"
version = "0.1.0"
description = "LLM-provider workload simulation on the SimCore DES kernel (pure Python policy layer)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
# The runtime dependency is the sibling `simcore` extension module built
# from simcore-python/ (not published to PyPI), so it is intentionally not
# declared here.
dependencies = []

[tool.setuptools.packages.find]
include = ["sim_llm*"]
