version = 1

# Bulk annotation for prose and uncommentable files: markdown docs, .gitignore
# files, the cargo-regenerated lockfile, and the pip requirements list.
[[annotations]]
path = [
    "**/*.md",
    ".gitignore",
    "compare/.gitignore",
    "Cargo.lock",
    "compare/requirements.txt",
    "llms.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Christoph Kuhmuench <christoph.kuhmuench@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"
